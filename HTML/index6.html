<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="black">
        <caption>Student Data</caption>
        <thead>
         <tr>
            <th>Name</th>
            <th>Roll Number</th>
        </tr>
        </thead>
      
       <tbody>
         <tr>
            <td>Hariom Shukla</td>
            <td>049</td>
        </tr>
         <tr>
            <td>Ashutish Shukla</td>
            <td>050</td>
        </tr>
       </tbody>
    </table>

<h1>Table with colspan</h1>

     <table border="black">
       
        <thead>
         <tr>
           <th colspan="2">Information</th>
        </tr>
        </thead>
      
       <tbody>
         <tr>
            <td>Hariom Shukla</td>
            <td>049</td>
        </tr>
         <tr>
            <td>Ashutish Shukla</td>
            <td>050</td>
        </tr>
       </tbody>
    </table>
</body>
</html>
